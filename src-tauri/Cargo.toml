[workspace]
members = ["crates/charon-shortcut-core", "crates/charon-input-helper"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"

[workspace.lints.rust]
unreachable_pub = "allow"

[package]
name = "homeborismygitcharon"
version = "0.8.0"
description = "Linux-first push-to-talk transcription"
authors = ["Charon contributors"]
edition = "2021"
default-run = "homeborismygitcharon"

[lib]
name = "homeborismygitcharon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
cpal = "0.15"
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
hound = "3"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
charon-shortcut-core = { path = "crates/charon-shortcut-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
url = "2"

